; 3_motor -- drives both motors through a fixed forward/turn/stop sequence,
; no camera and no WiFi involved. See src/SetMotor.h for how the two low-side
; MOSFETs on GPIO13/GPIO12 replace the keyestudio car's I2C motor controller.
; Same board/pinning rationale as 1_blink -- see its platformio.ini.
;
; NOTE: this sketch runs the drive sequence unconditionally on boot/reset --
; make sure the robot has room to move before flashing/resetting it. It only
; ever drives forward, so "room to move" means room in front of it.

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
