; 1_blink -- simplest demo, just blinks the RGB LED (GPIO4).
;
; The stock keyestudio version of this sketch toggled a plain LED on GPIO12
; with digitalWrite and needed no library at all. This board has no plain LED:
; D3 is a TX1812DB addressable RGB pixel on GPIO4 (see the schematic), so even
; "turn the light on" has to clock out a colour. Hence the NeoPixel dependency
; in what is otherwise the most trivial sketch in the repo.
;
; GPIO12 is NOT free here -- it is motor 2. Do not blink it.
;
; Same physical module as the other three sketches (AI-Thinker ESP32-CAM),
; so pinned to the same platform version for consistency, even though this
; sketch is far too simple to be sensitive to it.

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel @ ^1.12.0
monitor_speed = 115200
upload_speed = 460800
