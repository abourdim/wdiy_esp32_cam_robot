; 2_breathing_light -- fades the RGB LED (GPIO4) up and down.
;
; The keyestudio original did this with analogWrite() on a plain LED. An
; addressable pixel has no analog input to write, so the fade is done in
; software by scaling the colour value -- same effect, different mechanism.
; Same board/pinning rationale as 1_blink -- see its platformio.ini.

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel @ ^1.12.0
monitor_speed = 115200
upload_speed = 460800
