; CamRobot firmware -- PlatformIO project
; Board: AI-Thinker ESP32-CAM module plugged into the esp32_cam_plugin_robot
; carrier (KiCad project 01_kicad/4_esp32_cam_plugin_robot). The GPIO map is
; hardcoded across src/SetMotor.h, src/lights.h and src/pir.h and comes from
; that schematic, not from the module -- the module only decides the camera
; pins and which of the rest are safe to touch.
;
; If your specific module isn't recognized as "esp32cam", run `pio boards
; espressif32` to list alternatives (e.g. some clones work better under
; esp-wrover-kit).

; Only the plain build runs when no -e is given. Without this, `pio run -t
; upload` would walk every environment in this file and try to flash the robot
; three times -- once over USB, once over the network with no address, and once
; with the motion-sensor build. The other two are opt-in with -e (and are what
; launch.sh's "Build a specific environment" and OTA options pass).
[platformio]
default_envs = esp32cam

[env:esp32cam]
; Pinned rather than left as "espressif32" (latest). Unpinned, PlatformIO grabs
; whatever the newest platform release is, which can bundle a materially
; different arduino-esp32 core / esp32-camera driver than whatever Arduino
; IDE's Boards Manager had installed when this sketch last worked -- camera
; sensor-probe behavior has changed across versions. 6.5.0 (arduino-esp32
; 2.0.14) is the long-standing stable baseline most ESP32-CAM camera-server
; sketches, including this one, were originally written against.
;
; It also pins the LEDC API. SetMotor.h drives the motors with the 2.x
; ledcSetup()/ledcAttachPin() pair, which arduino-esp32 3.x replaced with
; ledcAttach(). Moving to a 3.x-based platform means editing motor_init().
platform = espressif32@6.5.0
board = esp32cam
framework = arduino

; huge_app.csv (the "Huge APP (3MB No OTA/1MB SPIFFS)" Arduino IDE scheme)
; has no OTA partitions at all, so OTA firmware updates need min_spiffs.csv
; instead: two ~1.9MB app slots (app0/app1) plus a small spiffs. The firmware
; is currently ~1MB, comfortably under 1.9MB -- but this is a harder ceiling
; on future growth than the 3MB huge_app.csv gave. Arduino IDE users need to
; pick "Minimal SPIFFS (1.9MB APP with OTA)" from Tools > Partition Scheme to
; match -- see README.md's Build systems / OTA sections.
board_build.partitions = min_spiffs.csv

; tzapu/WiFiManager backs the web-triggered "WiFi setup" captive portal (see
; enterWifiSetupPortal() in app_server.h). Same version as the other WDIY
; projects that use it, for consistency.
;
lib_deps =
    tzapu/WiFiManager @ ^2.0.17

monitor_speed = 115200

; The carrier has no auto-reset circuit -- J3 is a bare 4-pin FTDI header with
; 5V, RX, TX and GND and nothing else, and GPIO0 is not broken out to a button
; either. So flashing means grounding IO0 by hand and tapping reset, and a
; slower, more reliable upload speed is worth having. Bump it up if your
; programmer handles it fine.
upload_speed = 460800

; PSRAM. Arduino IDE's Tools > PSRAM: Enabled sets -DBOARD_HAS_PSRAM and
; -mfix-esp32-psram-cache-issue behind the scenes; under PlatformIO the
; esp32cam board definition already carries BOTH in its own extra_flags, so
; they are repeated below only to keep them visible at the point where somebody
; reading this file will look for them. Without BOARD_HAS_PSRAM, psramFound()
; can behave differently than it did under Arduino IDE, and the cache-issue fix
; avoids a known silicon errata when camera + PSRAM are both active.
;
; Stamps the short git revision into the binary as GIT_REV, so a running robot
; can report exactly which commit it came from (shown in the control page
; footer, in /status, and on serial at boot). Fails soft: no git, no .git
; directory, or a shallow checkout just leaves the firmware's own "nogit"
; default in place. Arduino IDE has no equivalent hook, so builds from there
; always report "nogit".
extra_scripts = pre:git_rev.py

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Network firmware push over ArduinoOTA (works whether the robot is on its own
; AP or joined to a router -- see ota_flash.sh). `pio run -e esp32cam-ota -t
; upload --upload-port <robot-ip>` instead of a USB/FTDI connection. Worth
; setting up here more than on most boards: with no auto-reset and no IO0
; button, a wired reflash is a two-handed job.
[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_flags =

